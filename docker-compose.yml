services:
  db:
    image: postgres:16
    container_name: postgres-db
    ports:
      - "5434:5432"
    restart: always
    environment:
      POSTGRES_PASSWORD: changemeinprod!
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer:latest
    container_name: adminer
    restart: always
    depends_on:
      - db
    ports:
      - "8888:8080"

volumes:
  postgres_data: